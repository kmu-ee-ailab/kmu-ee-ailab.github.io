news:
  count: 8

research_intro: "Our methods center on correspondence across views and modalities, learning from human interaction, and training from scarce data. The topics below are where they are applied today."

# Topics shown on the landing page; the full list is on /research/.
research_topics:
  - title: "Analysis of Multimodal LLMs"
    url: /research/multimodal-llms/
    image: /images/publications/2025-12-01-see-hear-and-understand-benchmarking-fig1.png
    text: "Benchmarks and diagnostic tools for how multimodal LLMs integrate audio, visual, and linguistic signals: audiovisual speech understanding, active speaker detection, multi-hop document reasoning, and contamination detection."
  - title: "Registration of Multimodal Retinal Images"
    url: /research/retinal-registration/
    image: /images/publications/2025-03-01-active-diffusion-matching-score-based-i-fig1.png
    text: "Aligning fundus, fluorescein angiography, and ultra-widefield retinal images across large appearance and geometric gaps, using score-based diffusion, autoregressive transformation, and generative enhancement."
  - title: "The FIREFLY Dataset"
    url: /research/firefly-dataset/
    image: /images/publications/FIREFLY_thumbnail.png
    text: "A registered fundus–FA dataset with fine-scale vessel and artery/vein annotations, extended with diffusion-based synthetic counterparts (FIREFLY-Gen)."
  - title: "Vessel Analysis of Retinal Images"
    url: /research/retinal-vessel-analysis/
    image: /images/publications/2025-11-24-improving-retinal-vessel-assessment-prec-fig1.png
    text: "Topology-aware vessel segmentation and artery/vein classification, interactive and prompt-based refinement, fundus image enhancement, and generative modeling for vessel-annotated data."
  - title: "Mass and Abnormality Detection from Chest X-ray"
    url: /research/chest-xray-detection/
    image: /images/publications/2023-01-01-abnormality-detection-in-chest-x-ray-via-fig4.png
    text: "Generative-comparison anomaly detection and disentangled targeted generation for chest X-ray analysis under weak or no lesion-level supervision."
  - title: "Mass Detection from Mammography and Ultrasound"
    url: /research/breast-mass-detection/
    image: /images/publications/2019-03-01-joint-weakly-and-semi-supervised-deep-le-fig1.png
    text: "Cascade and classification-based microcalcification detection in mammograms, weakly/semi-supervised mass detection in breast ultrasound, and interpretable retrieval-augmented BI-RADS diagnosis."

