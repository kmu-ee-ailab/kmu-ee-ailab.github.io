<style>
:root{--navy:#1E2761;--ice:#CADCFC;--coral:#F96167;--ink:#26324B;--mut:#6B7590;--tint:#EEF3FC;--pink:#FDECEC}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:#f4f6fb;color:var(--ink);line-height:1.6}
#app{max-width:560px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column}
header{color:#fff;padding:12px 18px 10px;position:sticky;top:0;z-index:5;transition:background .8s}
header.st1{background:#1E2761} header.st2{background:#27496D} header.st3{background:#3B2F5C}
.top{display:flex;justify-content:space-between;align-items:center}
.age{font-size:20px;font-weight:700;cursor:default;user-select:none}
.dots{display:flex;gap:4px}.dots i{width:14px;height:5px;border-radius:3px;background:rgba(255,255,255,.22)}.dots i.on{background:var(--ice)}.dots i.cur{background:var(--coral)}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.bar .lab{font-size:11px;color:var(--ice);display:flex;justify-content:space-between}
.bar .track{height:6px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden;margin-top:3px}
.bar .fill{height:100%;background:var(--ice);transition:width .5s}.bar .fill.low{background:var(--coral)}
.tools{display:flex;gap:8px;margin-top:9px}
.tools button{font:inherit;font-size:12.5px;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:999px;padding:5px 12px;cursor:pointer}
.tools button:disabled{opacity:.35;cursor:default}
main{padding:18px 18px 28px;flex:1}
h1{font-size:26px;color:var(--navy);margin:8px 0 6px;line-height:1.3}
h2{font-size:19px;color:var(--navy);margin:6px 0 10px;line-height:1.4}
p{margin:0 0 12px;font-size:15.5px}.sub{color:var(--mut);font-size:14px}
button{font:inherit;cursor:pointer;border:0}
.opt{display:block;width:100%;text-align:left;background:var(--tint);color:var(--ink);padding:13px 16px;border-radius:12px;margin:9px 0;font-size:15px;line-height:1.5;border:2px solid transparent}
.opt:hover,.opt:focus-visible{border-color:var(--navy);outline:none}.opt b{color:var(--navy)}
.go{display:block;width:100%;background:var(--navy);color:#fff;padding:14px;border-radius:12px;font-size:16px;font-weight:700;margin-top:16px}
.go.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.card{background:var(--tint);border-radius:12px;padding:14px 16px;margin:12px 0;font-size:15.5px}
.card.hard{background:var(--pink)}.card.res{background:#fff;border:2px solid var(--tint)}
.card .k{font-size:12px;font-weight:700;letter-spacing:1px;margin-bottom:4px;color:var(--navy)}.card.hard .k{color:var(--coral)}
.cat{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:1px;padding:3px 10px;border-radius:999px;background:var(--tint);color:var(--navy)}
.cat.c-life{background:var(--navy);color:#fff}.cat.c-family{background:var(--pink);color:#c5383e}.cat.c-work{background:#E6F0EA;color:#2C6E49}.cat.c-money{background:#FFF3D6;color:#8A6100}
.badge{margin-top:8px;font-size:12.5px;color:#8A4B00;background:#FFF3D6;border-radius:8px;padding:6px 10px}

.chip{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--tint);color:var(--navy);font-weight:700}

.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;background:var(--navy);color:#fff;padding:12px;border-radius:10px;text-align:center;letter-spacing:1px;word-break:break-all;user-select:all}

.big .n{font-size:22px;font-weight:700;color:var(--navy)}.big .l{font-size:12px;color:var(--mut)}.big .lowv .n{color:var(--coral)}
#side{padding:0 18px}
.panel{background:#fafbfe;border:1px solid #e6eaf3;border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:13px}

<body>
<div id="app">
<header id="hd" class="st1" hidden>
  <div class="top"><div class="age" id="age"></div><div class="dots" id="dots"></div></div>
  <div class="bars" id="bars"></div><div class="tools" id="tools"></div>
</header>
<main id="main" aria-live="polite"></main>
<div id="side"></div>
<footer>가상의 시나리오입니다. 수치와 제도는 2025~2026년 통계·보도를 단순화한 것이고, 금액은 어림값입니다. 제도는 해마다 바뀌니 실제 결정 전에는 그 시점의 공식 안내를 확인하세요. 이 게임에는 정답 경로가 없습니다.</footer>
</div>
<script>
"use strict";
/* ===== 스토리렛 엔진 (콘텐츠와 분리) ===== */
const VIS=[["money","돈"],["time","시간"],["career","커리어"],["rel","관계"]];
const HID=[["health","건강"],["trust","둘 사이의 신뢰"],["bond","아이와의 애착"],["rep","회사 평판"]];
const START_AGE=26, END_AGE=36, PER_YEAR=3, RAISE=2;
const CAT={life:"인생의 갈림길",daily:"일상",work:"회사",family:"가족",money:"돈"};

function newState(seed){ return {age:START_AGE,n:0,q:{money:50,time:50,career:50,rel:50,health:60,trust:55,bond:50,rep:50},
  flags:{dating:1},seen:{},queue:[],rng:(seed>>>0)||1,log:[],cur:null,phase:"q",out:null,cats:[],done:false}; }
function rnd(S){ let t=S.rng+=0x6D2B79F5; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return((t^t>>>14)>>>0)/4294967296; }
const has=(S,f)=>!!S.flags[f];
function cmp(v,expr){ const m=/^(>=|<=|>|<|==)(-?\d+)$/.exec(expr); if(!m) throw new Error("bad expr "+expr); const n=+m[2];
  return m[1]===">="?v>=n:m[1]==="<="?v<=n:m[1]===">"?v>n:m[1]==="<"?v<n:v===n; }
function eligible(S,e,ignoreAge){
  if(!ignoreAge&&e.age&&(S.age<e.age[0]||S.age>e.age[1])) return false;
  const r=e.req||{};
  if(r.flags&&!r.flags.every(f=>has(S,f))) return false;
  if(r.any&&!r.any.some(f=>has(S,f))) return false;
  if(r.not&&r.not.some(f=>has(S,f))) return false;
  if(r.q) for(const k in r.q) if(!cmp(S.q[k],r.q[k])) return false;
  if(e.id in S.seen){ if(e.cd==null) return false; if(S.age-S.seen[e.id]<e.cd) return false; }
  return true;
}
function pickNext(S,EV,BY){
  for(let guard=0;guard<40;guard++){
    if(S.age>=END_AGE){ S.done=true; S.cur=null; return null; }
    if(S.n>=PER_YEAR){ S.age++; S.n=0; S.cats=[]; yearDrift(S); S.newYear=true; continue; }
    // 1) 예약된 후속 이벤트
    const qi=S.queue.findIndex(x=>x.at<=S.age&&BY[x.id]&&eligible(S,BY[x.id],true));
    if(qi>=0){ const it=S.queue.splice(qi,1)[0]; return setCur(S,BY[it.id],{from:it.from,ago:S.age-it.fromAge}); }
    // 조건이 깨진 예약은 버림
    S.queue=S.queue.filter(x=>!(x.at<=S.age&&BY[x.id]&&!eligible(S,BY[x.id],true)));
    // 2) 반드시 나오는 이벤트 (must)
    const must=EV.filter(e=>e.must&&!e.queued&&eligible(S,e)).sort((a,b)=>(b.p||0)-(a.p||0));
    if(must.length&&!(S.cats.includes("life")&&must[0].cat==="life"&&!must[0].urgent)) return setCur(S,must[0],null);
    // 3) 가중치 랜덤
    const pool=EV.filter(e=>!e.must&&!e.queued&&eligible(S,e));
    if(!pool.length){ S.n=PER_YEAR; continue; }
    let tot=0; const ws=pool.map(e=>{ let w=(e.w||2)*(S.cats.includes(e.cat)?0.35:1); tot+=w; return w; });
    let x=rnd(S)*tot, i=0; while(i<ws.length-1&&(x-=ws[i])>0) i++;
    return setCur(S,pool[i],null);
  }
  S.done=true; S.cur=null; return null;
}
/* 해가 바뀔 때의 완만한 변화: 월급은 오르고, 일은 손에 익고, 돌보지 않은 것은 조금씩 식는다 */
function yearDrift(S){ const q=S.q, c=(k,d)=>q[k]=Math.max(0,Math.min(100,q[k]+d));
  c("money",RAISE); c("time",2); c("health",-1);
  if(S.flags.married||S.flags.cohab||S.flags.dating) c("trust",-2);
  if(S.flags.child) c("bond",-2); }
function setCur(S,e,badge){ S.cur={id:e.id,badge:badge}; S.phase="q"; S.out=null; return e; }
function fill(S,t){ const P=has(S,"married")?"배우자":has(S,"cohab")?"파트너":"연인"; return String(t).replace(/\{P\}/g,P); }
function choicesOf(S,e){ return e.choices.filter(c=>{ const r=c.req; if(!r) return true;
  if(r.flags&&!r.flags.every(f=>has(S,f))) return false; if(r.not&&r.not.some(f=>has(S,f))) return false;
  if(r.any&&!r.any.some(f=>has(S,f))) return false; if(r.q) for(const k in r.q) if(!cmp(S.q[k],r.q[k])) return false; return true; }); }
function choose(S,e,c){
  const fx=c.fx||{}; for(const k in fx) S.q[k]=Math.max(0,Math.min(100,S.q[k]+fx[k]));
  (c.set||[]).forEach(f=>S.flags[f]=1); (c.unset||[]).forEach(f=>delete S.flags[f]);
  (c.queue||[]).forEach(([id,d])=>S.queue.push({id,at:S.age+d,from:c.l.replace(/<br>.*/,"").replace(/<[^>]+>/g,""),fromAge:S.age}));
  S.seen[e.id]=S.age; S.n++; S.cats.push(e.cat);
  S.log.push({age:S.age,cat:e.cat,title:e.title,label:c.l.replace(/<br>.*/,"").replace(/<[^>]+>/g,"")});
  S.phase="o"; S.out={text:fill(S,c.o),fx:fx,fact:e.fact||null}; S.newYear=false;
}
function ending(S){
  const f=x=>has(S,x);
  let form;
  if(f("married")) form=f("reg")?"법률혼 부부":"결혼식은 올렸지만 혼인신고는 미룬 부부";
  else if(f("cohab")) form="혼인신고 없이 함께 사는 두 사람";
  else if(f("dating")) form=f("long_distance")?"장거리 연애 중":"만나는 사람이 있는 1인 가구";
  else form="혼자 사는 삶";
  if(f("child")) form+=", 아이 하나"; else if(f("child_plan")) form+=", 아이를 기다리는 중"; else if(f("no_child")&&(f("married")||f("cohab"))) form+=", 둘이서";
  if(f("pet")) form+=" (그리고 반려동물)";
  const arr=VIS.map(([k,l])=>[k,l,S.q[k]]).sort((a,b)=>a[2]-b[2]);
  const low={money:"돈 걱정이 10년을 따라다녔습니다. 선택의 순간마다 통장 잔고가 먼저 떠올랐습니다.",time:"늘 시간에 쫓겼습니다. 쉬는 법을 잊은 채 서른여섯이 됐습니다.",career:"회사에서의 자리는 기대만큼 올라가지 못했습니다. 동기들과의 거리가 느껴집니다.",rel:"곁에 있는 사람이 줄었습니다. 좋은 일이 생겨도 전할 사람을 한참 생각합니다."};
  const high={money:"돈은 선택지를 넓혀 주었습니다. 급한 일이 생겨도 버틸 여유가 있습니다.",time:"내 시간을 지켰습니다. 하고 싶은 일을 할 저녁이 있습니다.",career:"일에서는 믿음을 얻었습니다. 맡는 일의 크기가 달라졌습니다.",rel:"곁에 사람들이 있습니다. 힘든 날 전화할 곳이 있습니다."};
  const notes=[];
  const lv=(v,a,b,c)=>v>=65?a:v>=40?b:c;
  notes.push(["건강",lv(S.q.health,"몸은 10년 전보다 오히려 가볍습니다.","크게 아픈 데는 없지만, 계단에서 숨이 찹니다.","몸이 여러 번 신호를 보냈습니다. 이제는 무시하기 어렵습니다.")]);
  notes.push(["회사 평판",lv(S.q.rep,"사람들은 어려운 일이 생기면 당신을 찾습니다.","무난한 동료로 기억됩니다.","당신에 대해 좋지 않은 이야기가 돌고 있습니다.")]);
  if(f("married")||f("cohab")||f("dating")) notes.push(["둘 사이",lv(S.q.trust,"서로의 하루를 궁금해합니다. 다퉈도 같은 편이라는 걸 압니다.","큰 문제는 없지만, 대화가 일정 조율로만 채워지는 날이 늘었습니다.","같은 집에 있어도 각자의 방에 있습니다. 꺼내지 못한 말이 쌓여 있습니다.")]);
  if(f("child")) notes.push(["아이와 나",lv(S.q.bond,"아이는 무서운 꿈을 꾸면 당신을 부릅니다.","아이는 당신을 좋아하지만, 속상한 일은 다른 사람에게 먼저 말합니다.","아이가 당신 앞에서 조금 어색해합니다.")]);
  return {form,low:arr[0],high:arr[3],lowText:low[arr[0][0]],highText:high[arr[3][0]],notes};
}
if(typeof module!=="undefined") module.exports={VIS,HID,CAT,START_AGE,END_AGE,newState,pickNext,choose,choicesOf,eligible,ending,fill};

"use strict";
const FACT={
 jeonse:"전세사기 피해자로 인정된 사람의 75.9%가 40세 미만이고, 97.7%는 보증금 3억 원 이하였습니다. (국토교통부, 2026년 9월 말 기준 보도)",
 marry:"평균 초혼 연령은 남자 33.9세, 여자 31.6세입니다(2025년). \"결혼은 해야 한다\"는 20대는 44.7%, \"결혼하지 않아도 함께 살 수 있다\"는 20대는 79.2%입니다. (국가데이터처 2026년 사회조사)",
 reg:"신혼부부 버팀목 전세대출은 부부 합산 연소득 7,500만 원 이하가 기준으로 안내됩니다(2026년 보도 기준, 변동 가능). 미혼일 때는 각자의 소득으로 심사받습니다. 이 때문에 신고를 미루는 부부가 있어 '결혼 페널티' 논쟁이 이어지고 있습니다.",
 law:"법률혼이 아니면 상속권이 없고, 건강보험 피부양자 등록이나 회사의 가족 복지도 대개 받기 어렵습니다. 사실혼으로 인정받으면 일부 보호가 있지만, 그 사실을 본인이 입증해야 합니다.",
 solo:"1인 가구는 전체 가구의 약 36%로, 가장 흔한 가구 형태입니다. (통계청, 2024년 기준)",
 leaveStat:"2024년 육아휴직을 시작한 사람 가운데 아빠는 29.2%였고, 그해 태어난 아이의 아버지 가운데 육아휴직을 쓴 사람은 10.2%였습니다. (국가데이터처 2024년 육아휴직통계)",
 leavePay:"육아휴직 급여 상한은 1~3개월 월 250만 원, 4~6개월 200만 원, 7개월부터 160만 원입니다. 생후 18개월 안에 부모가 모두 쓰면 첫 6개월 상한이 최대 450만 원까지 올라갑니다(6+6 제도). 2024년 아빠 육아휴직자의 67.9%는 300인 이상 기업 소속이었습니다.",
 care:"가족돌봄휴직은 1년에 최대 90일까지 쓸 수 있지만, 법으로 정해진 급여가 없는 무급 휴직입니다.",
 loss:"9주차에 본 계산: 45% 떨어진 돈이 원래대로 돌아오려면 약 82% 올라야 합니다. 빚을 낸 투자는 회복을 기다릴 기회 자체가 사라질 수 있습니다.",
 report:"8주차에 본 것: 신뢰는 실수를 하지 않는 데서가 아니라, 실수를 먼저 말하는 데서 쌓입니다.",
 ai:"10주차에 본 연구: 숙련 개발자들은 AI를 쓰면 20% 빨라졌다고 느꼈지만 실제로는 19% 더 오래 걸렸습니다. 검증에 드는 시간이 숨어 있었습니다. (METR 2025)",
 grade:"경총 조사에서 기업이 신규 채용 때 가장 중요하게 보는 것은 직무 관련 경험(74.6%)이었습니다. (2024)",
 safety:"팀원들이 실수를 말해도 불이익이 없다고 느끼는 팀일수록 더 많이 배우고 성과도 좋았습니다. (Edmondson 1999)"
};
const EVENTS=[
/* ================= 인생의 갈림길 ================= */
{id:"home",cat:"life",title:"첫 직장, 어디서 살까",age:[26,26],must:true,p:9,fact:FACT.jeonse,
 text:"전자 회사에 엔지니어로 입사했습니다. 통장에 찍히는 돈은 월 300만 원쯤. 회사는 부모님 집에서 편도 1시간 30분 거리입니다. 그리고 만난 지 1년 된 연인이 있습니다.",

 choices:[
  {l:"<b>둘째를 갖기로 한다</b>",fx:{money:-6,time:-7,trust:3,rel:4,health:-3},set:["second"],o:"첫째 때 쓴 물건을 다시 꺼냈습니다. 이번에는 무엇이 힘든지 알고 시작합니다."},
  {l:"<b>하나로 충분하다고 정한다</b>",fx:{time:2,money:2},o:"둘이서 오래 이야기하고 정했습니다. 아이에게는 사촌들과 자주 만나게 해 주기로 했습니다."}]},
{id:"long_distance_trip",cat:"family",title:"격주의 KTX",age:[29,35],req:{flags:["long_distance","dating"]},cd:2,w:5,
 text:"이번 주는 내가 내려갈 차례입니다. 금요일에 급한 일이 터졌습니다.",
 choices:[
  {l:"<b>일을 토요일 새벽까지 끝내고 첫차를 탄다</b>",fx:{trust:5,health:-3,time:-3},o:"역에 마중 나온 연인이 내 얼굴을 보고 말합니다. \"자, 일단 자.\""},
  {l:"<b>이번 주는 못 가겠다고 한다</b>",fx:{trust:-6,career:1},o:"\"괜찮아\"라는 답장이 왔습니다. 마침표가 찍혀 있습니다."}]}
];
if(typeof module!=="undefined") module.exports={EVENTS,FACT};

/* ===== 화면 ===== */
(function(){
const $=id=>document.getElementById(id);
const BY={}; EVENTS.forEach(e=>BY[e.id]=e);
let S=null,H=[],debug=/[?&]debug/.test(location.search),taps=0,showTL=false;
function stageClass(){ return S.age<=28?"st1":S.age<=32?"st2":"st3"; }
function header(){
  $("hd").hidden=false; $("hd").className=stageClass();
  $("age").textContent=(S.done?"36세 · 10년 뒤":S.age+"세");
  const y=S.age-START_AGE; $("dots").innerHTML=Array.from({length:END_AGE-START_AGE},(_,i)=>`<i class="${i<y?"on":i===y&&!S.done?"cur":""}"></i>`).join("");
  $("bars").innerHTML=VIS.map(([k,l])=>`<div class="bar"><div class="lab"><span>${l}</span><span>${S.q[k]}</span></div><div class="track"><div class="fill ${S.q[k]<=25?"low":""}" style="width:${S.q[k]}%"></div></div></div>`).join("");
  $("tools").innerHTML=`<button id="back" ${H.length?"":"disabled"}>← 이전으로</button><button id="tl">지나온 길 ${S.log.length}</button>`;
  $("back").onclick=back; $("tl").onclick=()=>{showTL=!showTL;side();};
  side();
}
function side(){
  let h="";
  if(showTL) h+=`<div class="panel"><div class="k">지나온 길</div>${S.log.length?`<ol>${S.log.map(l=>`<li><span>${l.age}세 · ${CAT[l.cat]}</span> ${l.title.replace(/\{P\}/g,"상대")} — ${l.label}</li>`).join("")}</ol>`:"아직 선택이 없습니다."}</div>`;
  if(debug) h+=`<div class="panel dbg"><div class="k">디버그</div><b>숨은 수치</b> ${HID.map(([k,l])=>l+" "+S.q[k]).join(" · ")}<br><b>플래그</b> ${Object.keys(S.flags).join(", ")||"-"}<br><b>예약</b> ${S.queue.map(x=>x.id+"@"+x.at).join(", ")||"-"}<br><b>올해 카드</b> ${S.n}/3 · <b>시드</b> ${S.seed}</div>`;
  $("side").innerHTML=h;
}
function intro(){
  $("hd").hidden=true; $("side").innerHTML="";
  $("main").innerHTML=`<p class="sub">사제동행세미나 · 가족의 상식</p><h1>스물여섯,<br>앞으로 10년</h1>
  <p>당신은 26세, 막 입사한 엔지니어입니다. 서른여섯까지 해마다 세 장의 카드를 만납니다. 인생의 큰 결정도 있고, 야근한 밤의 저녁 메뉴도 있습니다.</p>
  <div class="card"><div class="k">규칙</div>선택할 때마다 <b>돈 · 시간 · 커리어 · 관계</b>가 움직입니다. 건강, 신뢰, 평판처럼 <b>보이지 않는 수치</b>도 함께 움직이고, 어떤 선택은 몇 년 뒤에 돌아옵니다. 어떤 카드가 나올지는 지금까지의 선택에 따라 달라집니다. 정답 경로는 없습니다.</div>
  <p class="sub">15분쯤 걸립니다. 언제든 '이전으로'를 눌러 선택을 바꿔 볼 수 있습니다.</p>
  <button class="go" id="start">시작하기</button>`;
  $("start").onclick=()=>{ const seed=(Date.now()^(Math.random()*1e9))>>>0; S=newState(seed); S.seed=seed; H=[]; next(); };
  window.scrollTo(0,0);
}
function next(){ const e=pickNext(S,EVENTS,BY); if(!e) return finish(); question(); }
function question(){
  const e=BY[S.cur.id]; header();
  const b=S.cur.badge; const badge=b?`<div class="badge">↩ ${b.ago>0?b.ago+"년 전":"얼마 전"}, “${b.from}”을 골랐기 때문에</div>`:"";
  const ny=S.newYear&&S.n===0&&S.age>START_AGE?`<div class="ny">${S.age}세가 되었습니다. 월급이 조금 올랐습니다.</div>`:"";
  const cs=choicesOf(S,e);
  $("main").innerHTML=`${ny}<div class="cat c-${e.cat}">${CAT[e.cat]}</div>${badge}<h2>${fill(S,e.title)}</h2><p>${fill(S,e.text)}</p>`+
    cs.map((c,i)=>`<button class="opt" data-i="${i}">${fill(S,c.l)}</button>`).join("");
  document.querySelectorAll(".opt").forEach(bn=>bn.onclick=()=>{ H.push(JSON.stringify(S)); choose(S,e,cs[+bn.dataset.i]); outcome(); });
  window.scrollTo(0,0);
}
function outcome(){
  const e=BY[S.cur.id], o=S.out; header();
  const chips=VIS.filter(([k])=>o.fx[k]).map(([k,l])=>`<span class="chip ${o.fx[k]<0?"neg":""}">${l} ${o.fx[k]>0?"+":""}${o.fx[k]}</span>`).join("");
  const hidden=HID.some(([k])=>o.fx[k])?`<span class="chip ghost">보이지 않는 것도 움직였습니다</span>`:"";
  $("main").innerHTML=`<div class="cat c-${e.cat}">${CAT[e.cat]}</div><h2>${fill(S,e.title)}</h2>
   <div class="card res">${o.text}</div><div class="delta">${chips}${hidden}</div>
   ${o.fact?`<div class="fact">${o.fact}</div>`:""}
   <button class="go" id="next">다음</button>`;
  $("next").onclick=next; window.scrollTo(0,0);
}
function back(){ if(!H.length) return; S=JSON.parse(H.pop()); question(); }
function finish(){
  header(); const e=ending(S);
  const code=S.seed.toString(36).toUpperCase()+"-"+VIS.map(([k])=>S.q[k]).join(".");
  $("main").innerHTML=`<h2>서른여섯의 당신</h2><p><b>${e.form}</b></p>
   <div class="big">${VIS.map(([k,l])=>`<div class="${k===e.low[0]?"lowv":""}"><div class="n">${S.q[k]}</div><div class="l">${l}</div></div>`).join("")}</div>
   <div class="card hard"><div class="k">10년의 그늘 · ${e.low[1]}</div>${e.lowText}</div>
   <div class="card"><div class="k">10년이 남긴 것 · ${e.high[1]}</div>${e.highText}</div>
   <p class="sub" style="margin-top:18px">그동안 보이지 않던 것들</p>
   ${e.notes.map(n=>`<div class="note"><b>${n[0]}</b> ${n[1]}</div>`).join("")}
   <p class="sub" style="margin-top:18px">결과 코드</p><div class="code">${code}</div>
   <div class="card" style="margin-top:16px"><div class="k">조에서 이야기해 보세요</div>① 가장 오래 망설인 카드는 무엇이었나요?<br>② 몇 년 뒤에 돌아온 선택이 있었나요? 그때 알았다면 다르게 골랐을까요?<br>③ 어떤 고난은 개인의 선택이 아니라 제도가 만든 것이었나요?<br>④ 큰 결정과 일상의 작은 선택 중, 10년 뒤를 더 많이 바꾼 건 어느 쪽이었나요?</div>
   <button class="go ghost" id="again">처음부터 다시 해 보기</button>`;
  $("again").onclick=intro; showTL=true; side(); window.scrollTo(0,0);
}
$("age").onclick=()=>{ if(++taps>=5){ debug=!debug; taps=0; side(); } };
intro();
})();

</script>
</body>
</html>
